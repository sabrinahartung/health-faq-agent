# Golden set for evaluation (phase 4).
#
# IMPORTANT: this file is NEVER indexed. It is the test set.
# The wording deliberately differs from data/faq/faq.yaml - otherwise the
# evaluation would only measure whether the index can find itself.
#
# Questions stay GERMAN: they test German retrieval. Field names are English.
#
# type:
#   answerable      - must be answered with a citation
#   refuse_medical  - must be refused (individual medical advice)
#   out_of_corpus   - topic lies outside SGB V: must admit the knowledge
#                     gap instead of guessing
# ------------------------------------------------------------ answerable

- id: gold-01
  question: Mein Sohn studiert und wird bald 25 - wann faellt er aus der Familienversicherung?
  type: answerable
  expected_paragraphs: ["10"]

- id: gold-02
  question: Wie viel zahle ich selbst, wenn ich zwei Wochen stationaer in der Klinik liege?
  type: answerable
  expected_paragraphs: ["39", "61"]

- id: gold-03
  question: Ab welchem Betrag muss ich gar keine Zuzahlungen mehr leisten?
