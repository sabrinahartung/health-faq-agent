# Golden Set fuer die Evaluation (Phase 4).
#
# WICHTIG: Diese Datei wird NIEMALS indexiert. Sie ist die Testmenge.
# Die Formulierungen sind bewusst andere als in data/faq/faq.yaml -
# sonst misst die Evaluation nur, ob der Index sich selbst wiederfindet.
#
# typ:
#   beantwortbar        - muss mit Fundstelle beantwortet werden
